<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>新しいパスワードの設定 - PAPA'S RECIPE</title>
    <style>
        /* スタイルは signup.html に近いものにしています */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { background-color: #F8F9FA; font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 35px 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 16px !important; outline: none; }
        .btn { background-color: #00b894; color: white; border: none; width: 100%; padding: 16px; border-radius: 30px; font-weight: bold; font-size: 1em; cursor: pointer; }
        .help-text { font-size: 0.75em; color: #999; text-align: left; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>新しいパスワード</h3>
        {% if validlink %}
            <p style="font-size: 0.9em; color: #666;">今度は忘れへんように気をつけてな！</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn">パスワードを変更する</button>
            </form>
        {% else %}
            <p style="color: #ff7675;">このリンクはもう使われへんみたいやわ。<br>もう一回最初からやり直してみて！</p>
            <a href="{% url 'password_reset' %}" style="color: #6c5ce7; font-size: 0.9em;">リセット画面に戻る</a>
        {% endif %}
    </div>
</body>
</html>
