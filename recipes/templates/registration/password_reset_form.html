<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>パスワードリセット - PAPA'S RECIPE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { background-color: #F8F9FA; font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 35px 25px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        .logo { font-size: 1.5em; font-weight: 700; color: #333; text-decoration: none; display: block; margin-bottom: 20px; }
        p { font-size: 0.9em; color: #666; margin-bottom: 25px; line-height: 1.6; }
        input[type="email"] { width: 100%; padding: 16px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 16px !important; outline: none; background-color: #FDFDFD; }
        .btn { background-color: #6c5ce7; color: white; border: none; width: 100%; padding: 16px; border-radius: 30px; font-weight: bold; font-size: 1em; cursor: pointer; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2); }
        .back-link { font-size: 0.85em; color: #999; text-decoration: none; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
    <div style="background: white; border-radius: 25px; padding: 40px 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 400px; margin: 40px auto; text-align: center; box-sizing: border-box;">

        <div style="font-size: 3.5em; margin-bottom: 20px;">🚧</div>
        <h3 style="color: #333; margin-bottom: 15px; font-weight: 700;">パスワードリセットは準備中やで</h3>

        <div style="background-color: #fff4f4; border: 1.5px solid #ff7675; border-radius: 15px; padding: 20px; margin-bottom: 25px;">
            <p style="font-size: 0.95em; color: #444; line-height: 1.6; margin: 0;">
                ごめんやで！<br>
                この機能は今一生懸命作ってるところやねん。👩‍💻<br><br>
                もしパスワード忘れてログインできへんくなったら、<strong>直接 Rie（管理者）に連絡してな！</strong><br><br>
                こっちで新しいパスワードを仮発行して教えるわ！
            </p>
        </div>

        <a href="{% url 'login' %}" style="display: block; background-color: #6c5ce7; color: white; padding: 16px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 1em; box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2);">
            ログイン画面に戻る
        </a>

        {% comment %}
        <div class="card">
            <a href="/" class="logo">🍳 PAPA'S RECIPE</a>
            <h3>パスワードを忘れた？</h3>
            <p>登録してるメールアドレスを教えてな。<br>リセット用のリンクを送るで！</p>
            <form method="post">
                {% csrf_token %}
                <input type="email" name="email" placeholder="メールアドレス" required>
                <button type="submit" class="btn">リセットメールを送る</button>
            </form>
            <a href="{% url 'login' %}" class="back-link">← ログイン画面に戻る</a>
        </div>
        {% endcomment %}

    </div>
</body>
</html>
