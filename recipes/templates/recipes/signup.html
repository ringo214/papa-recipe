<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規登録 - PAPA'S RECIPE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap');
        body { background-color: #FAFAFA; font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; }
        .logo { font-size: 1.5em; letter-spacing: 2px; margin-bottom: 20px; display: block; color: #333; text-decoration: none; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #00cec9; }
        .btn-signup { background-color: #00cec9; color: white; border: none; width: 100%; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: opacity 0.3s; margin-top: 10px; }
        .btn-signup:hover { opacity: 0.9; }
        .back-link { font-size: 0.85em; color: #999; text-decoration: none; display: inline-block; margin-top: 20px; }
        .back-link:hover { text-decoration: underline; }
        /* エラーメッセージ用のデザイン */
        .helptext { font-size: 0.75em; color: #666; text-align: left; display: block; margin-bottom: 10px;}
        ul.errorlist { color: #ff7675; font-size: 0.8em; text-align: left; padding-left: 20px; margin-top: -10px; margin-bottom: 10px;}
    </style>
</head>
<body>
    <div class="login-card">
        <a href="/" class="logo">🍳 PAPA'S RECIPE</a>
        <h3 style="color: #555; margin-bottom: 20px; font-size: 1.1em;">新規ユーザー登録</h3>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-signup">登録する</button>
        </form>

        <a href="{% url 'login' %}" class="back-link">← ログイン画面に戻る</a>
    </div>
</body>
</html>
