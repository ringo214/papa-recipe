{% extends 'recipes/base.html' %}

{% block content %}
<style>
    /* 🌟 レシート確認画面専用のスタイル */
    .confirm-card {
        background: white;
        padding: 25px 20px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        margin-bottom: 20px;
    }
    
    .confirm-title {
        text-align: center;
        font-size: 1.2em;
        color: #6c5ce7;
        margin-bottom: 25px;
        font-weight: 700;
    }

    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        font-size: 0.8em;
        color: #999;
        margin-bottom: 6px;
        margin-left: 5px;
    }

    /* iPhoneズーム防止策（16px以上）はbase.htmlで一括適用済み */
    .form-control {
        width: 100%;
        padding: 12px;
        border: 1px solid #eee;
        border-radius: 12px;
        background-color: #fdfdfd;
        box-sizing: border-box;
    }

    /* ❄️ 冷蔵庫セクション */
    .fridge-section {
        background-color: #f0f7ff; /* 優しい水色 */
        padding: 20px;
        border-radius: 15px;
        margin-top: 25px;
    }

    .fridge-title {
        font-size: 0.9em;
        font-weight: bold;
        color: #0984e3;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .item-row {
        display: flex;
        align-items: center;
        gap: 12px;
        background: white;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 10px;
        border: 1px solid #e1f0ff;
    }

    .item-checkbox {
        width: 22px;
        height: 22px;
        accent-color: #00cec9;
        flex-shrink: 0;
    }

    .item-name-input {
        border: none;
        background: transparent;
        font-size: 0.95em;
        width: 100%;
        color: #333;
    }

    .btn-save {
        width: 100%;
        background-color: #00cec9;
        color: white;
        border: none;
        padding: 18px;
        border-radius: 35px;
        font-weight: bold;
        font-size: 1.1em;
        margin-top: 25px;
        box-shadow: 0 4px 15px rgba(0, 206, 201, 0.2);
    }

    .btn-cancel {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #999;
        text-decoration: none;
        font-size: 0.85em;
    }
</style>

<div class="confirm-card">
    <div class="confirm-title">🛒 内容の確認</div>
    
    <form action="{% url 'budget_list' %}" method="POST">
        {% csrf_token %}
        <input type="hidden" name="save_from_scan" value="true">

        <div class="form-group">
            <label>日付</label>
            <input type="date" name="date" value="{{ scan_data.date }}" class="form-control">
        </div>

        <div class="form-group">
            <label>店名（家計簿の項目名）</label>
            <input type="text" name="item_name" value="{{ scan_data.item_name }}" class="form-control" placeholder="店名を入力">
        </div>

        <div class="form-group">
            <label>合計金額</label>
            <div style="position: relative;">
                <input type="number" name="amount" value="{{ scan_data.amount }}" class="form-control" style="padding-right: 40px;">
                <span style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #999; font-size: 0.9em;">円</span>
            </div>
        </div>

        <div class="form-group">
            <label>カテゴリー</label>
            <select name="category" class="form-control">
                {% for code, name in category_choices %}
                    <option value="{{ code }}" {% if code == scan_data.category %}selected{% endif %}>{{ name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="fridge-section">
            <div class="fridge-title">❄️ 冷蔵庫に入れるもの</div>
            <p style="font-size: 0.75em; color: #74b9ff; margin-bottom: 15px;">チェックを入れたものが在庫に追加されるで！</p>
            
            {% for item in scan_data.item_list_raw %}
            <div class="item-row">
                <input type="checkbox" name="selected_items" value="{{ item }}" class="item-checkbox" checked>
                <input type="text" name="item_names_actual" value="{{ item }}" class="item-name-input">
            </div>
            {% endfor %}
        </div>

        <button type="submit" class="btn-save">この内容で保存する！</button>
        <a href="{% url 'budget_list' %}" class="btn-cancel">キャンセルして戻る</a>
    </form>
</div>
{% endblock %}
