{% extends 'recipes/base.html' %}

{% block content %}
<div class="card-form">
    <h2 style="text-align: center; font-size: 1.1em; margin-bottom: 25px;">⚙️ カテゴリ別予算設定</h2>
    <form method="post">
        {% csrf_token %}
        {% for config in config_list %}
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
            <span style="font-size: 0.9em; font-weight: 500;">{{ config.name }}</span>
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="number" name="budget_{{ config.code }}" value="{{ config.amount }}" 
                       style="width: 100px; text-align: right; padding: 8px; border-radius: 8px; border: 1px solid #ddd;">
                <span style="font-size: 0.8em; color: #999;">円</span>
            </div>
        </div>
        {% endfor %}
        <button type="submit" style="width:100%; background:#6c5ce7; color:white; border:none; padding:15px; border-radius:30px; font-weight:bold; margin-top:20px;">
            設定を保存する
        </button>
    </form>
    <a href="{% url 'budget_list' %}" style="display:block; text-align:center; margin-top:15px; color:#999; text-decoration:none; font-size:0.8em;">戻る</a>
</div>
{% endblock %}
